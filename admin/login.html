<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.14.0/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans&family=Jost&family=Montserrat&display=swap"
        rel="stylesheet">
    <!-- fontawesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <section class="hero-section other_pages">
        <div class="rgba-hero-bg other_pages_rgba">
            <!-- header text -->
            <div class="hero-content">
                <div class="container text-center bg-header-container">
                    <h1>Admin</h1>
                </div>
            </div>
        </div>
    </section>


    <!-- ============== PAYMENT SECTION ================ -->
    <section class="access_section">
        <div class="container">
            <div class="access_container">

                <form action="" class="form">

                    <div class="form-row">
                        <label for="" class="form-label">Email</label>
                        <input type="email" class="form-input" placeholder="Email">
                    </div>
                    <div class="form-row">
                        <label for="" class="form-label">Password</label>
                        <input type="password" class="form-input" placeholder="Password">
                    </div>
                    <div class="form-row">
                        <button class="btn btn-block">LOGIN</button>
                    </div>
                </form>


            </div>
        </div>
    </section>



    <!-- ============== FOOTER SECTION ================ -->
    <section class="footer_section">
        <div class="container">
            <div class="footer_container">
                <p>© World-Class Industrial Machines wcim.com. All rights Reserved.</p>
            </div>
        </div>
    </section>



    <script src="main.js"></script>

    <script>
        function copyAccount() {
            const text = document.getElementById("accountNumber").innerText;
            navigator.clipboard.writeText(text);

            alert("Account number copied!");
        }
    </script>
</body>

</html>
